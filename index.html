<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bruce Yeh – CV</title>
<style>
:root{--bg:#000;--fg:#fff;--muted:#8c8c92;--line:#26262a;--accent:#2f6bff;--card:#111113;--danger:#ff6b6b;--grad:linear-gradient(160deg,#1550ff 0%,#8a3cff 60%,#f04df2 100%)}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font:17px/1.65 "Helvetica Neue",-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC","PingFang TC",sans-serif;background:var(--bg);color:var(--fg);-webkit-font-smoothing:antialiased}
a{color:#6f9bff;text-decoration:none}a:hover{text-decoration:underline}
header.top{position:sticky;top:0;background:rgba(10,10,11,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);z-index:10}
.bar{max-width:1200px;margin:auto;padding:14px 32px;display:flex;justify-content:space-between;align-items:center;gap:16px}
nav a{margin-right:28px;color:#fff;font-size:15px;font-weight:500}
nav a:hover{color:#9db8ff;text-decoration:none}
.lang{border:2px solid #fff;background:transparent;border-radius:6px;padding:7px 18px;font-size:14px;font-weight:600;cursor:pointer;color:#fff}
.lang:hover{background:#fff;color:#000}
main{max-width:1200px;margin:auto;padding:0 32px 100px}
section{padding:88px 0 0}
h1{font-size:clamp(42px,6.2vw,80px);line-height:1.08;margin:72px 0 12px;letter-spacing:-.02em;font-weight:600}
.sub{font-size:clamp(20px,2.4vw,28px);color:var(--muted);margin:0 0 24px;line-height:1.35}
.contact{display:flex;flex-wrap:wrap;gap:8px 24px;font-size:15px;color:var(--muted)}
#about .summary{margin-top:40px;color:#d4d4d8}
h2{font-size:22px;font-weight:300;letter-spacing:.14em;text-transform:uppercase;color:#fff;margin:0 0 32px;padding:0}
h2::after{content:"";display:block;width:56px;height:3px;margin-top:14px;background:var(--grad);border-radius:2px}
p{margin:0 0 14px}
.comp{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:20px}
.box{position:relative;background:var(--grad);border-radius:24px;padding:28px;color:#fff}
.box h3{margin:0 0 10px;font-size:20px;font-weight:600}.box p{margin:0;font-size:15px;color:rgba(255,255,255,.88)}
.job{position:relative;margin-bottom:20px;background:var(--card);border:1px solid var(--line);border-radius:24px;padding:28px 32px}
.job-h{display:flex;justify-content:space-between;flex-wrap:wrap;gap:4px}
.job h3{margin:0;font-size:24px;font-weight:600}
.period{color:#9db8ff;font-size:14px;letter-spacing:.04em}
.role{margin:4px 0 14px;color:var(--muted);font-size:15px}
.job ul{margin:0;padding-left:20px}.job li{margin-bottom:10px;font-size:15.5px;color:#d4d4d8}
.filters{display:flex;gap:10px;margin-bottom:28px;flex-wrap:wrap}
.chip{border:1px solid #3a3a40;background:transparent;border-radius:999px;padding:7px 20px;font-size:14px;cursor:pointer;color:#fff}
.chip:hover{border-color:#fff}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:20px}
.card{position:relative;background:var(--card);border:1px solid var(--line);border-radius:24px;overflow:hidden;display:flex;flex-direction:column;transition:border-color .2s,transform .2s}
.card:hover{border-color:var(--accent);transform:translateY(-2px)}
.card img{width:100%;height:170px;object-fit:cover}
.card .in{padding:24px;display:flex;flex-direction:column;gap:8px;flex:1}
.card h3{margin:0;font-size:20px;font-weight:600;line-height:1.3}
.card h3 a{color:#fff}
.metric{font-weight:600;font-size:15px;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent}
.card p{font-size:14.5px;color:#b4b4ba;margin:0}
.meta{font-size:12px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:auto;padding-top:12px}
.tag{font-size:11.5px;background:#1d1d21;border-radius:999px;padding:3px 10px;color:#a1a1a8}
.two{display:grid;grid-template-columns:1fr 1fr;gap:40px}
@media(max-width:700px){.two{grid-template-columns:1fr}nav{display:none}.job{padding:22px}.bar,main{padding-left:20px;padding-right:20px}}
.edu{position:relative;margin-bottom:16px;font-size:16px}.edu span.s{display:block;color:var(--muted);font-size:14px}
ul.plain{margin:0;padding-left:20px;font-size:15.5px;color:#d4d4d8}
footer{text-align:center;color:var(--muted);font-size:13px;padding:40px;border-top:1px solid var(--line)}


.edu-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:20px}
.edu-grid .edu{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:24px 28px;margin:0}
.edu-grid .edu strong{display:block;font-size:18px;font-weight:600;line-height:1.35;margin-bottom:6px}
.aw-h{margin:40px 0 14px;font-size:14px;font-weight:300;letter-spacing:.14em;text-transform:uppercase}
ul.awards{list-style:none;margin:0;padding:0}
ul.awards li{position:relative;padding:12px 0 12px 22px;border-top:1px solid var(--line);font-size:16px;color:#d4d4d8}
ul.awards li::before{content:"";position:absolute;left:0;top:50%;width:8px;height:8px;margin-top:-4px;border-radius:50%;background:var(--grad)}

/* ---- edit mode ---- */
body.edit{padding-bottom:84px}
body.edit .sumrow{margin-top:20px}
body.edit .sumrow .ctl-row{top:-18px;right:0}
.sumrow{position:relative}
.ed{outline:1px dashed rgba(111,155,255,.5);outline-offset:2px;border-radius:3px;cursor:text;min-width:2em;display:inline-block}
h1.ed,p.ed,li.ed,h3.ed,div.ed{display:block}
li.ed{display:list-item}
.ed:hover{background:rgba(47,107,255,.12)}
.ed:focus{outline:2px solid var(--accent);background:rgba(47,107,255,.16)}
.ed:empty::before{content:attr(data-ph);color:#6b6b72;font-style:italic;-webkit-text-fill-color:#6b6b72}
.ctl-row{position:absolute;top:8px;right:8px;display:flex;gap:4px;z-index:2}
li .ctl-row,.edu .ctl-row{position:static;display:inline-flex;margin-left:8px;vertical-align:middle}
.ctl{border:1px solid #3a3a40;background:#1a1a1d;border-radius:6px;padding:0 7px;font-size:12px;line-height:22px;cursor:pointer;color:#c4c4ca}
.ctl:hover{background:#26262a;color:#fff}.ctl.danger:hover{color:var(--danger)}
.box .ctl{background:rgba(0,0,0,.35);border-color:rgba(255,255,255,.3);color:#fff}
.add{border:1px dashed var(--accent);background:transparent;color:#9db8ff;border-radius:10px;padding:7px 16px;font-size:14px;cursor:pointer;margin-top:10px}
.add:hover{background:rgba(47,107,255,.14)}
.editbar[hidden]{display:none}
.editbar{position:fixed;left:0;right:0;bottom:0;background:#0d0d0f;border-top:1px solid var(--line);padding:12px 24px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;z-index:50}
.editbar button{font:inherit;font-size:14px;border:1px solid #3a3a40;background:#16161a;border-radius:8px;padding:7px 14px;cursor:pointer;color:#fff}
.editbar button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
#status{font-size:13px;color:var(--muted);flex:1;min-width:140px}
#status.ok{color:#5eead4}#status.err{color:var(--danger)}
.banner{background:rgba(47,107,255,.12);border:1px solid rgba(47,107,255,.4);color:#c7d7ff;border-radius:12px;padding:10px 16px;font-size:13px;margin:20px 0 0}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:100;display:flex;align-items:center;justify-content:center;padding:16px}
.dlg{background:#16161a;border:1px solid var(--line);border-radius:18px;padding:22px;max-width:520px;width:100%;max-height:90vh;overflow:auto;color:#fff}
.dlg h3{margin:0 0 8px}
.dlg label{display:block;font-size:12px;color:var(--muted);margin:10px 0 3px}
.dlg input,.dlg select{width:100%;font:inherit;padding:8px 10px;border:1px solid #3a3a40;border-radius:8px;background:#0d0d0f;color:#fff}
.dlg .hint{font-size:12px;color:var(--muted)}
.dlg .acts{margin-top:16px;text-align:right}
.dlg button{font:inherit;border:1px solid #3a3a40;background:#1d1d21;color:#fff;border-radius:8px;padding:8px 18px;cursor:pointer}
.dlg button.primary{background:var(--accent);border-color:var(--accent)}

.sd{max-width:820px}
.sd .row{display:grid;grid-template-columns:auto 1fr;gap:10px;padding:12px;border-radius:12px;margin:10px 0;border:1px solid #2a2a2e}
.sd .row.add{background:rgba(34,197,94,.10);border-color:rgba(34,197,94,.45)}
.sd .row.edit{background:rgba(250,204,21,.10);border-color:rgba(250,204,21,.45)}
.sd .row.delete{background:rgba(239,68,68,.10);border-color:rgba(239,68,68,.45)}
.sd .row input[type=checkbox]{width:auto;margin-top:4px}
.sd .tagk{display:inline-block;font-size:11px;font-weight:700;border-radius:4px;padding:1px 8px;margin-right:8px;color:#000}
.sd .add .tagk{background:#4ade80}.sd .edit .tagk{background:#facc15}.sd .delete .tagk{background:#f87171}
.sd .lbl{font-size:12px;color:var(--muted)}
.sd .src{font-size:14px;color:#d4d4d8;margin:6px 0;white-space:pre-wrap}
.sd .old{font-size:14px;color:#9a9aa2;text-decoration:line-through;white-space:pre-wrap;margin:6px 0}
.sd textarea{width:100%;min-height:70px;font:inherit;font-size:14px;padding:8px 10px;border:1px solid #3a3a40;border-radius:8px;background:#0d0d0f;color:#fff;resize:vertical}
.sd .sum{font-size:13px;color:var(--muted);margin:6px 0}
.sd .acts{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
</style>
</head>
<body>
<header class="top"><div class="bar">
  <nav id="nav"></nav>
  <button class="lang" id="langBtn">中文</button>
</div></header>
<main id="app"></main>
<footer><span id="foot"></span></footer>
<div class="editbar" id="editbar" hidden>
  <button id="bGh">⚙ GitHub 連線</button>
  <button id="bSync">🔄 同步中英文</button>
  <button id="bAi">🔑 翻譯設定</button>
  <button class="primary" id="bSave">儲存到 GitHub</button>
  <button id="bExport">匯出 JSON</button>
  <button id="bImport">匯入 JSON</button>
  <input type="file" id="fImport" accept=".json" hidden>
  <span id="status"></span>
</div>
<script>
const EDIT=new URLSearchParams(location.search).has('edit');
const UI={
  en:{about:'About',skills:'Skills',exp:'Experience',work:'Portfolio',edu:'Education & Awards',all:'All',awards:'Awards',
      cats:{management:'Management Results',people:'People Leadership',tools:'Tools & Systems',other:'Other'}},
  zh:{about:'簡介',skills:'核心能力',exp:'工作經歷',work:'作品集',edu:'學歷與獎項',all:'全部',awards:'獎項',
      cats:{management:'管理成果',people:'人員領導',tools:'工具與系統',other:'其他'}}
};
const TPL={
  summary:()=>({en:'',zh:''}),bullets:()=>({en:'',zh:''}),awards:()=>({en:'',zh:''}),
  competencies:()=>({title:{en:'',zh:''},text:{en:'',zh:''}}),
  experience:()=>({company:'',tagline:{en:'',zh:''},role:{en:'',zh:''},location:{en:'',zh:''},period:{en:'',zh:''},bullets:[]}),
  portfolio:()=>({category:'management',title:{en:'',zh:''},role:{en:'',zh:''},period:{en:'',zh:''},metric:{en:'',zh:''},desc:{en:'',zh:''},tags:'',link:'',image:''}),
  education:()=>({degree:{en:'',zh:''},school:{en:'',zh:''},period:''})
};
let D=null,sha=null,dirty=false,lang=localStorage.getItem('lang')||((navigator.language||'').startsWith('zh')?'zh':'en'),filter='all';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const safeUrl=u=>/^(https?:\/\/|mailto:|images\/)/i.test(u||'')?u:'';
const t=o=>o?(typeof o==='string'?o:(o[lang]||o.en||o.zh||'')):'';

/* ---- path helpers: '@' = current language ---- */
const parts=p=>p.split('.').map(k=>k==='@'?lang:k);
const getP=p=>parts(p).reduce((o,k)=>o==null?o:o[k],D);
function setP(p,v){const a=parts(p),last=a.pop();let o=D;for(const k of a){if(o[k]==null||typeof o[k]!=='object')o[k]={};o=o[k]}o[last]=v}
const getArr=p=>p.split('.').reduce((o,k)=>o[k],D);

/* ---- render helpers ---- */
const has=p=>EDIT||!!getP(p);
function E(path,ph,tag='span',cls='',single=true){
  const v=getP(path)||'';
  if(!EDIT)return v?`<${tag}${cls?` class="${cls}"`:''}>${esc(v)}</${tag}>`:'';
  return `<${tag} class="${cls} ed" data-p="${path}" data-ph="${esc(ph)}" data-single="${single?1:0}" contenteditable="plaintext-only">${esc(v)}</${tag}>`;
}
const ctl=(path,gear='')=>!EDIT?'':`<span class="ctl-row">${gear}<button class="ctl" data-act="up" data-path="${path}" title="上移">↑</button><button class="ctl" data-act="down" data-path="${path}" title="下移">↓</button><button class="ctl danger" data-act="del" data-path="${path}" title="刪除">✕</button></span>`;
const addBtn=(path,tpl,label)=>!EDIT?'':`<div><button class="add" data-act="add" data-path="${path}" data-tpl="${tpl}">＋ ${label}</button></div>`;

function render(){
  const U=UI[lang],p=D.profile,y=window.scrollY;
  document.documentElement.lang=lang==='zh'?'zh-Hant':'en';
  document.title=(t(p.name)||'CV')+' – CV';
  document.getElementById('langBtn').textContent=EDIT?(lang==='zh'?'編輯中：中文 → 切到 EN':'Editing: EN → 切到中文'):(lang==='zh'?'EN':'中文');
  document.getElementById('nav').innerHTML=[['about',U.about],['skills',U.skills],['exp',U.exp],['work',U.work],['edu',U.edu]].map(([id,l])=>`<a href="#${id}">${l}</a>`).join('');
  const catKeys=Object.keys(U.cats);
  const cats=EDIT?catKeys:catKeys.filter(c=>D.portfolio.some(x=>x.category===c));
  const items=D.portfolio.map((x,i)=>[x,i]).filter(([x])=>filter==='all'||x.category===filter);
  const contact=[
    has('profile.location.@')&&E('profile.location.@','地點 / Location'),
    p.email&&`<a href="mailto:${esc(p.email)}">${esc(p.email)}</a>`,
    p.phone&&esc(p.phone),
    safeUrl(p.linkedin)&&`<a href="${esc(p.linkedin)}" target="_blank" rel="noopener">LinkedIn</a>`,
    safeUrl(p.github)&&`<a href="${esc(p.github)}" target="_blank" rel="noopener">GitHub</a>`].filter(Boolean);
  document.getElementById('app').innerHTML=`
  ${EDIT?`<div class="banner">編輯模式：直接點文字修改。右上角按鈕切換語言，可分別編輯中文與英文。完成後按下方「儲存到 GitHub」。</div>`:''}
  <section id="about" style="padding-top:0">
    ${E('profile.name.@','姓名 / Name','h1')}
    ${has('profile.title.@')?E('profile.title.@','職稱 / Title','p','sub'):''}
    <div class="contact">${contact.map(c=>`<span>${c}</span>`).join('')}${EDIT?`<button class="ctl" data-act="profile">✎ Email／電話／連結</button>`:''}</div>
    <div class="summary">${D.summary.map((s,i)=>`<div class="sumrow">${E(`summary.${i}.@`,'簡介段落 / Summary paragraph','p','',false)}${ctl('summary.'+i)}</div>`).join('')}${addBtn('summary','summary','新增段落')}</div>
  </section>
  <section id="skills"><h2>${U.skills}</h2><div class="comp">
    ${D.competencies.map((c,i)=>`<div class="box">${ctl('competencies.'+i)}${E(`competencies.${i}.title.@`,'標題','h3')}${E(`competencies.${i}.text.@`,'內容','p','',false)}</div>`).join('')}</div>
    ${addBtn('competencies','competencies','新增能力')}</section>
  <section id="exp"><h2>${U.exp}</h2>
    ${D.experience.map((j,i)=>`<div class="job">${ctl('experience.'+i)}
      <div class="job-h">${E(`experience.${i}.company`,'公司','h3')}${E(`experience.${i}.period.@`,'期間','span','period')}</div>
      <p class="role">${E(`experience.${i}.role.@`,'職稱')}${has(`experience.${i}.location.@`)?' · '+E(`experience.${i}.location.@`,'地點'):''}${has(`experience.${i}.tagline.@`)?' — '+E(`experience.${i}.tagline.@`,'公司簡述'):''}</p>
      <ul>${(j.bullets||[]).map((b,k)=>`<li>${E(`experience.${i}.bullets.${k}.@`,'成果重點','span','',false)}${ctl(`experience.${i}.bullets.${k}`)}</li>`).join('')}</ul>
      ${addBtn(`experience.${i}.bullets`,'bullets','新增重點')}</div>`).join('')}
    ${addBtn('experience','experience','新增經歷')}</section>
  <section id="work"><h2>${U.work}</h2>
    <div class="filters">${['all',...cats].map(c=>`<button class="chip ${filter===c?'on':''}" data-f="${c}">${c==='all'?U.all:U.cats[c]}</button>`).join('')}</div>
    <div class="grid">${items.map(([x,i])=>{
      const link=safeUrl(x.link),img=safeUrl(x.image),T=E(`portfolio.${i}.title.@`,'標題','h3');
      const title=EDIT||!link?T:`<h3><a href="${esc(link)}" target="_blank" rel="noopener">${esc(t(x.title))} ↗</a></h3>`;
      return `<div class="card">${ctl('portfolio.'+i,`<button class="ctl" data-act="card" data-path="${i}" title="類別／標籤／連結／圖片">⚙</button>`)}
      ${img?`<img src="${esc(img)}" alt="${esc(t(x.title))}" loading="lazy">`:''}
      <div class="in"><div class="meta">${esc(U.cats[x.category]||x.category)}${t(x.period)?' · '+esc(t(x.period)):''}${t(x.role)?' · '+esc(t(x.role)):''}</div>
      ${title}${has(`portfolio.${i}.metric.@`)?E(`portfolio.${i}.metric.@`,'量化成果','div','metric'):''}
      ${E(`portfolio.${i}.desc.@`,'說明','p','',false)}
      <div class="tags">${String(x.tags||'').split(',').map(s=>s.trim()).filter(Boolean).map(s=>`<span class="tag">${esc(s)}</span>`).join('')}</div></div></div>`}).join('')}</div>
    ${addBtn('portfolio','portfolio','新增作品')}</section>
  <section id="edu"><h2>${U.edu}</h2>
    <div class="edu-grid">${D.education.map((e,i)=>`<div class="edu">${ctl('education.'+i)}<strong>${E(`education.${i}.degree.@`,'學位','div')}</strong><span class="s">${E(`education.${i}.school.@`,'學校')} · ${E(`education.${i}.period`,'期間')}</span></div>`).join('')}</div>
    ${addBtn('education','education','新增學歷')}
    <h3 class="aw-h">${U.awards}</h3>
    <ul class="awards">${D.awards.map((a,i)=>`<li>${E(`awards.${i}.@`,'獎項','span','',false)}${ctl('awards.'+i)}</li>`).join('')}</ul>${addBtn('awards','awards','新增獎項')}</section>`;
  document.getElementById('foot').textContent='© '+new Date().getFullYear()+' '+t(p.name);
  document.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{filter=b.dataset.f;render();document.getElementById('work').scrollIntoView()});
  if(EDIT)document.querySelectorAll('[data-p]').forEach(n=>{
    n.addEventListener('input',()=>{dirty=true;setP(n.dataset.p,n.innerText.replace(/ /g,' ').trim())});
    if(n.dataset.single==='1')n.addEventListener('keydown',e=>{if(e.key==='Enter')e.preventDefault()});
  });
  window.scrollTo(0,y);
}

/* ---- edit-mode actions ---- */
function status(m,c=''){const s=document.getElementById('status');s.textContent=m;s.className=c}
function modal(title,fields,hint){
  const ov=document.createElement('div');ov.className='ov';
  const d=document.createElement('div');d.className='dlg';d.innerHTML=`<h3>${esc(title)}</h3>${hint?`<div class="hint">${hint}</div>`:''}`;
  fields.forEach(f=>{
    if(f.type==='custom'){d.append(f.build());return}
    const l=document.createElement('label');l.textContent=f.label;d.append(l);
    let i;
    if(f.type==='select'){i=document.createElement('select');f.options.forEach(([v,n])=>{const o=document.createElement('option');o.value=v;o.textContent=n;if(f.get()===v)o.selected=true;i.append(o)})}
    else if(f.type==='file'){i=document.createElement('input');i.type='file';i.accept='image/*';
      i.onchange=async()=>{const file=i.files[0];if(!file)return;if(file.size>2*1024*1024)return alert('圖片請小於 2MB');
        try{const path='images/'+Date.now()+'-'+file.name.replace(/[^\w.\-]/g,'_');
          const b64=await new Promise(r=>{const fr=new FileReader();fr.onload=()=>r(fr.result.split(',')[1]);fr.readAsDataURL(file)});
          status('上傳圖片中…');await gh(path,{method:'PUT',body:JSON.stringify({message:'Add image '+path,content:b64,branch:cfg().b})});
          f.onUpload(path);status('圖片已上傳','ok');alert('圖片已上傳，路徑已填入。')}catch(e){status('圖片上傳失敗：'+e.message,'err')}};
      d.append(i);return}

const clone=o=>JSON.parse(JSON.stringify(o));
let BASE=null;
const SEC={summary:'簡介',competencies:'核心能力',experience:'工作經歷',portfolio:'作品集',education:'學歷',awards:'獎項',profile:'基本資料'};
const FLD={title:'標題',text:'內容',role:'職稱／角色',location:'地點',period:'期間',tagline:'簡述',bullets:'重點',degree:'學位',school:'學校',metric:'量化成果',desc:'說明',name:'姓名'};
const getIn=(o,p)=>p.reduce((a,k)=>a==null?a:a[k],o);
function pairs(node,path,out){
  if(Array.isArray(node)){node.forEach((x,i)=>pairs(x,path.concat(i),out));return}
  if(node&&typeof node==='object'){const ks=Object.keys(node);
    if(ks.length&&ks.every(k=>k==='en'||k==='zh')&&ks.some(k=>typeof node[k]==='string')){out.push(path);return}
    ks.forEach(k=>pairs(node[k],path.concat(k),out))}
}
function labelOf(path){
  const sec=SEC[path[0]]||path[0];let item='';
  if(typeof path[1]==='number'){const it=D[path[0]][path[1]];
    const nm=it&&(it.company||(it.title&&(it.title.zh||it.title.en))||(it.degree&&(it.degree.zh||it.degree.en)));
    item=' #'+(path[1]+1)+(nm&&typeof nm==='string'?'（'+nm.slice(0,24)+'）':'')}
  const f=[...path].reverse().find(k=>typeof k==='string'&&FLD[k]);
  const bi=path.indexOf('bullets');const extra=bi>=0?' '+(path[bi+1]+1):'';
  return sec+item+(f?' › '+FLD[f]+extra:'')
}
function computeDiff(S){
  const T=S==='zh'?'en':'zh',out=[];let conflicts=0;
  pairs(D,[],[]);const ps=[];pairs(D,[],ps);
  ps.forEach(path=>{
    const n=getIn(D,path),b=getIn(BASE,path);
    const s=(n[S]||'').trim(),t=(n[T]||'').trim();
    const bs=b?(b[S]||'').trim():undefined,bt=b?(b[T]||'').trim():undefined;
    const base={id:path.join('.'),path,label:labelOf(path),src:s,old:t};
    if(s&&!t)out.push({...base,kind:'add'});
    else if(!s&&t)out.push({...base,kind:'delete'});
    else if(s&&t&&b&&s!==bs){ if(t===bt)out.push({...base,kind:'edit'}); else conflicts++ }
  });
  return {items:out,conflicts,S,T};
}

const aiReady=()=>{const c=aiCfg();return c.engine==='gemini'?!!c.gkey:!!c.key};
async function translate(items,S,T){
  const name={zh:'Traditional Chinese (Taiwan)',en:'English'};const res={};
  const c=aiCfg();
  for(let i=0;i<items.length;i+=25){
    const chunk=items.slice(i,i+25);
    const prompt=`You are a professional translator for resumes/CVs (medical device project management). Translate each item from ${name[S]} to ${name[T]}. Keep proper nouns, company names, standards (FDA, MDR, ISO 13485, IEC 60601) and acronyms unchanged. Keep any [bracketed placeholders], translating their content. Preserve meaning exactly; do not add or remove facts. If "existing" is given, keep its terminology and style, updating it only to match the new source text. Return ONLY a JSON object mapping each id to its translated string, no other text.\n\n`+JSON.stringify(chunk.map(x=>({id:x.id,context:x.label,text:x.src,existing:x.kind==='edit'?x.old:undefined})));
    let txt;
    if(c.engine==='gemini'){
      let r;
      for(let tryN=0;tryN<4;tryN++){
        r=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(c.gmodel)}:generateContent`,{method:'POST',headers:{'content-type':'application/json','x-goog-api-key':c.gkey},
          body:JSON.stringify({contents:[{parts:[{text:prompt}]}],generationConfig:{responseMimeType:'application/json',temperature:0.2}})});
        if(r.ok||![429,500,502,503,504].includes(r.status)||tryN===3)break;
        const wait=[3,8,15][tryN];status(`Gemini 暫時忙碌（${r.status}），${wait} 秒後自動重試（${tryN+1}/3）…`);
        await new Promise(res=>setTimeout(res,wait*1000));
      }
      if(!r.ok){let m=r.status+'';try{m+=' '+(await r.json()).error.message}catch{}throw new Error(m)}
      const j=await r.json();txt=(j.candidates?.[0]?.content?.parts||[]).map(p=>p.text||'').join('');
    }else{
      const r=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'content-type':'application/json','x-api-key':c.key,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
        body:JSON.stringify({model:c.model,max_tokens:8000,messages:[{role:'user',content:prompt}]})});
      if(!r.ok){let m=r.status+'';try{m+=' '+(await r.json()).error.message}catch{}throw new Error(m)}
      txt=(await r.json()).content.map(b=>b.text||'').join('');
    }
    const m=(txt||'').match(/\{[\s\S]*\}/);if(!m)throw new Error('翻譯結果格式錯誤');
    Object.assign(res,JSON.parse(m[0]));
  }
  return res;
}
function syncLangs(){
  if(!D)return;
  const ov=document.createElement('div');ov.className='ov';
  const d=document.createElement('div');d.className='dlg';

async function runSync(S0){
  const {items,conflicts,S,T}=computeDiff(S0);
  const nm={zh:'中文',en:'英文'};
  if(!items.length){status(`${nm[S]}與${nm[T]}版本已一致`+(conflicts?`（${conflicts} 項兩邊都有改動，已略過）`:''),'ok');return}
  const need=items.filter(i=>i.kind!=='delete');
  if(need.length){
    if(!aiReady()){status('需要先設定翻譯用 API Key','err');aiModal();return}
    status(`翻譯 ${need.length} 項中…`);
    try{const tr=await translate(need,S,T);need.forEach(i=>i.proposed=(tr[i.id]||'').trim())}
    catch(e){status('翻譯失敗：'+e.message,'err');return}
  }
  items.forEach(i=>{if(i.kind==='delete')i.proposed=''});
  status('請檢視差異','ok');
  reviewDiff(items,conflicts,S,T);
}
function reviewDiff(items,conflicts,S,T){
  const nm={zh:'中文',en:'英文'},kn={add:'新增',edit:'修改',delete:'刪除'};
  const ov=document.createElement('div');ov.className='ov';
  const d=document.createElement('div');d.className='dlg sd';
  const cnt=k=>items.filter(i=>i.kind===k).length;
  d.innerHTML=`<h3>同步${nm[T]}版本（以目前的${nm[S]}為準）</h3>
   <div class="sum">新增 ${cnt('add')} ・修改 ${cnt('edit')} ・刪除 ${cnt('delete')}${conflicts?` ・另有 ${conflicts} 項兩邊都被改過，已略過`:''}。請逐項確認，可直接編輯建議內容；尚未套用前不會改動任何資料。</div>`;
  const rows=items.map(it=>{
    const r=document.createElement('div');r.className='row '+it.kind;
    const cb=document.createElement('input');cb.type='checkbox';cb.checked=true;it.cb=cb;
    const body=document.createElement('div');
    body.innerHTML=`<div><span class="tagk">${kn[it.kind]}</span><span class="lbl">${esc(it.label)}</span></div>
      ${it.src?`<div class="lbl" style="margin-top:6px">${nm[S]}（來源）</div><div class="src">${esc(it.src)}</div>`:''}
      ${it.kind==='edit'?`<div class="lbl">${nm[T]}（目前）</div><div class="old">${esc(it.old)}</div>`:''}
      ${it.kind==='delete'?`<div class="lbl">${nm[T]}將被清空：</div><div class="old">${esc(it.old)}</div>`:''}`;
    if(it.kind!=='delete'){const lb=document.createElement('div');lb.className='lbl';lb.textContent=`${nm[T]}（建議，可編輯）`;
      const ta=document.createElement('textarea');ta.value=it.proposed;ta.oninput=()=>it.proposed=ta.value;body.append(lb,ta)}
    r.append(cb,body);return r});
  const list=document.createElement('div');rows.forEach(r=>list.append(r));d.append(list);
  const a=document.createElement('div');a.className='acts';
  const mk=(t,f,c)=>{const b=document.createElement('button');b.textContent=t;if(c)b.className=c;b.onclick=f;return b};
  a.append(mk('全選',()=>items.forEach(i=>i.cb.checked=true)),mk('全不選',()=>items.forEach(i=>i.cb.checked=false)),
    mk('取消',()=>{ov.remove();status('已取消同步')}),
    mk('套用選取項目',()=>{let n=0;items.forEach(i=>{if(!i.cb.checked)return;const node=getIn(D,i.path);node[T]=i.kind==='delete'?'':(i.proposed||'').trim();n++});
      ov.remove();if(n){dirty=true;render();status(`已套用 ${n} 項，請檢查後按「儲存到 GitHub」`,'ok')}},'primary'));
  d.append(a);ov.append(d);document.body.append(ov);
}

const DEF={o:'yehpoyen',r:'BRUCE_Portfolio',b:'main',t:''};
const cfg=()=>{try{return {...DEF,...JSON.parse(localStorage.getItem('cvadmin')||'{}')}}catch{return {...DEF}}};
const saveCfg=c=>localStorage.setItem('cvadmin',JSON.stringify(c));
const b64enc=s=>btoa(unescape(encodeURIComponent(s)));
const b64dec=s=>decodeURIComponent(escape(atob(s.replace(/\n/g,''))));
async function gh(path,opt={}){
  const c=cfg();if(!c.o||!c.r||!c.t)throw new Error('請先按「⚙ GitHub 連線」填入 Token');
  const res=await fetch(`https://api.github.com/repos/${c.o}/${c.r}/contents/${path}`+((opt.method||'GET')==='GET'?`?ref=${c.b}`:''),
    {...opt,cache:'no-store',headers:{Authorization:'Bearer '+c.t,Accept:'application/vnd.github+json','Content-Type':'application/json'}});
  if(!res.ok){let m=res.status+'';try{m+=' '+(await res.json()).message}catch{}throw new Error(m)}
  return res.json();
}
function ghModal(){
  const c=cfg();
  modal('GitHub 連線',[
    {label:'Owner（帳號）',get:()=>c.o,set:v=>{c.o=v.trim();saveCfg(c)}},
    {label:'Repo',get:()=>c.r,set:v=>{c.r=v.trim();saveCfg(c)}},
    {label:'Branch',get:()=>c.b,set:v=>{c.b=v.trim()||'main';saveCfg(c)}},
    {label:'Personal Access Token（只需此 repo 的 Contents: Read and write）',type:'password',ph:'github_pat_...',get:()=>c.t,set:v=>{c.t=v.trim();saveCfg(c)}}
  ],'Token 只存在這個瀏覽器的 localStorage。共用電腦請在用完後清空此欄。');
}
async function save(){
  try{status('儲存中…');const r0=await gh('data.json');
    const r=await gh('data.json',{method:'PUT',body:JSON.stringify({message:'Update CV data via inline editor',content:b64enc(JSON.stringify(D,null,2)+'\n'),sha:r0.sha,branch:cfg().b})});
    sha=r.content.sha;dirty=false;BASE=clone(D);status('已儲存！網站約 1 分鐘後更新','ok')}
  catch(e){status('儲存失敗：'+e.message,'err')}
}
