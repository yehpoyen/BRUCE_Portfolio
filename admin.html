<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>CV Admin</title>
<style>
:root{--bg:#fafaf9;--fg:#1c1917;--muted:#6b6560;--line:#e7e5e4;--accent:#0f766e;--card:#fff;--danger:#b91c1c}
*{box-sizing:border-box}
body{margin:0;font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC","PingFang TC",sans-serif;background:var(--bg);color:var(--fg)}
.wrap{max-width:900px;margin:auto;padding:24px}
h1{font-size:22px;margin:0 0 16px}
h2{font-size:16px;margin:0}
.panel{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:16px}
label{display:block;font-size:12px;color:var(--muted);margin:10px 0 3px}
input,textarea,select{width:100%;font:inherit;padding:7px 9px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--fg)}
textarea{min-height:64px;resize:vertical}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row3{display:grid;grid-template-columns:2fr 1fr 1fr;gap:10px}
@media(max-width:640px){.row,.row3{grid-template-columns:1fr}}
button{font:inherit;border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 12px;cursor:pointer;color:var(--fg)}
button:hover{background:#f5f5f4}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
button.primary:hover{background:#115e59}
button.danger{color:var(--danger)}
.toolbar{position:sticky;top:0;background:var(--bg);padding:10px 0;display:flex;gap:8px;align-items:center;flex-wrap:wrap;z-index:5;border-bottom:1px solid var(--line);margin-bottom:16px}
#status{font-size:13px;color:var(--muted);flex:1;min-width:120px}
#status.ok{color:var(--accent)}#status.err{color:var(--danger)}
details{border:1px solid var(--line);border-radius:10px;margin-bottom:10px;background:#fff}
details>summary{cursor:pointer;padding:10px 14px;font-weight:600;list-style:none}
details>summary::before{content:'▸ ';color:var(--muted)}details[open]>summary::before{content:'▾ '}
details .body{padding:0 14px 14px}
.actions{display:flex;gap:6px;margin-top:14px;flex-wrap:wrap}
.li{display:grid;grid-template-columns:1fr 1fr auto;gap:8px;margin-bottom:8px;align-items:start}
.sec-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.hint{font-size:12px;color:var(--muted)}
.imgprev{max-height:80px;margin-top:6px;border-radius:6px;display:block}
</style>
</head>
<body>
<div class="wrap">
<h1>CV 後台 / Admin</h1>

<div class="panel" id="conn">
  <div class="sec-h"><h2>GitHub 連線</h2><span class="hint">Token 只存在這個瀏覽器的 localStorage</span></div>
  <div class="row3">
    <div><label>Owner（帳號）</label><input id="gOwner" placeholder="your-username"></div>
    <div><label>Repo</label><input id="gRepo" placeholder="your-username.github.io"></div>
    <div><label>Branch</label><input id="gBranch" value="main"></div>
  </div>
  <label>Personal Access Token（fine-grained，只需此 repo 的 Contents: Read and write）</label>
  <input id="gToken" type="password" placeholder="github_pat_...">
  <div class="actions">
    <button class="primary" id="btnLoad">從 GitHub 載入</button>
    <button id="btnLocal">載入本機 data.json</button>
    <button id="btnForget" class="danger">清除已儲存的 Token</button>
  </div>
</div>

<div class="toolbar">
  <button class="primary" id="btnSave">儲存到 GitHub</button>
  <button id="btnExport">匯出 JSON</button>
  <button id="btnImport">匯入 JSON</button>
  <input type="file" id="fileImport" accept=".json" hidden>
  <span id="status"></span>
</div>
<div id="editor"></div>
</div>

<script>
let data=null,sha=null;
const $=id=>document.getElementById(id);
const el=(tag,attrs={},...kids)=>{const e=document.createElement(tag);for(const[k,v]of Object.entries(attrs)){if(k==='class')e.className=v;else if(k.startsWith('on'))e[k]=v;else e.setAttribute(k,v)}kids.flat().forEach(c=>e.append(c));return e};
function status(msg,cls=''){const s=$('status');s.textContent=msg;s.className=cls}

/* ---------- schema ---------- */
const CATS=[['management','管理成果 Management'],['people','人員領導 People'],['tools','工具與系統 Tools'],['other','其他 Other']];
const SECTIONS=[
 {key:'profile',title:'基本資料 Profile',single:true,fields:[
   ['name','雙語','姓名 Name'],['title','雙語','職稱 Title'],['location','雙語','地點 Location'],
   ['email','文字','Email'],['phone','文字','電話（留空則不公開）'],['linkedin','文字','LinkedIn URL'],['github','文字','GitHub URL']]},
 {key:'summary',title:'簡介 Summary',list:true,label:(x,i)=>'段落 '+(i+1),tpl:()=>({en:'',zh:''}),fields:[['','雙語區','段落']]},
 {key:'competencies',title:'核心能力 Competencies',list:true,label:x=>x.title?.zh||x.title?.en||'(新)',tpl:()=>({title:{en:'',zh:''},text:{en:'',zh:''}}),
   fields:[['title','雙語','標題'],['text','雙語區','內容']]},
 {key:'experience',title:'工作經歷 Experience',list:true,label:x=>(x.company||'(新)')+' – '+(x.role?.zh||x.role?.en||''),
   tpl:()=>({company:'',tagline:{en:'',zh:''},role:{en:'',zh:''},location:{en:'',zh:''},period:{en:'',zh:''},bullets:[]}),
   fields:[['company','文字','公司'],['tagline','雙語','公司簡述'],['role','雙語','職稱'],['location','雙語','地點'],['period','雙語','期間'],['bullets','雙語清單','重點成果']]},
 {key:'portfolio',title:'作品集 Portfolio',list:true,label:x=>'['+(x.category||'')+'] '+(x.title?.zh||x.title?.en||'(新)'),
   tpl:()=>({category:'management',title:{en:'',zh:''},role:{en:'',zh:''},period:{en:'',zh:''},metric:{en:'',zh:''},desc:{en:'',zh:''},tags:'',link:'',image:''}),
   fields:[['category','選單','類別'],['title','雙語','標題'],['role','雙語','角色'],['period','雙語','期間／單位'],['metric','雙語','量化成果'],['desc','雙語區','說明'],['tags','文字','標籤（逗號分隔）'],['link','文字','連結 URL'],['image','圖片','圖片（選填）']]},
 {key:'education',title:'學歷 Education',list:true,label:x=>x.degree?.zh||x.degree?.en||'(新)',tpl:()=>({degree:{en:'',zh:''},school:{en:'',zh:''},period:''}),
   fields:[['degree','雙語','學位'],['school','雙語','學校'],['period','文字','期間']]},
 {key:'awards',title:'獎項 Awards',list:true,label:x=>x.zh||x.en||'(新)',tpl:()=>({en:'',zh:''}),fields:[['','雙語','獎項']]}
];

/* ---------- field builders ---------- */
function bi(o,k,label,area){
  o[k]=(o[k]&&typeof o[k]==='object')?o[k]:{en:'',zh:''};
  const mk=(l,c)=>{const i=area?el('textarea'):el('input');i.value=o[k][l]||'';i.oninput=()=>o[k][l]=i.value;return el('div',{},el('label',{},label+' · '+c),i)};
  return el('div',{class:'row'},mk('en','EN'),mk('zh','中文'));
}
function biSelf(o,label,area){ // o itself is {en,zh}
  const mk=(l,c)=>{const i=area?el('textarea'):el('input');i.value=o[l]||'';i.oninput=()=>o[l]=i.value;return el('div',{},el('label',{},label+' · '+c),i)};
  return el('div',{class:'row'},mk('en','EN'),mk('zh','中文'));
}
function text(o,k,label){const i=el('input');i.value=o[k]||'';i.oninput=()=>o[k]=i.value;return el('div',{},el('label',{},label),i)}
function select(o,k,label){const s=el('select');CATS.forEach(([v,l])=>{const op=el('option',{value:v},l);if(o[k]===v)op.selected=true;s.append(op)});s.onchange=()=>o[k]=s.value;return el('div',{},el('label',{},label),s)}
function bilist(o,k,label){
  o[k]=o[k]||[];const box=el('div');
  const draw=()=>{box.innerHTML='';box.append(el('label',{},label));
    o[k].forEach((it,i)=>{
      const row=el('div',{class:'li'});
      const en=el('textarea');en.placeholder='EN';en.value=it.en||'';en.oninput=()=>it.en=en.value;
      const zh=el('textarea');zh.placeholder='中文';zh.value=it.zh||'';zh.oninput=()=>it.zh=zh.value;
      row.append(en,zh,el('button',{class:'danger',onclick:()=>{o[k].splice(i,1);draw()}},'✕'));box.append(row)});
    box.append(el('button',{onclick:()=>{o[k].push({en:'',zh:''});draw()}},'＋ 新增一條'))};
  draw();return box;
}
function image(o,k,label){
  const box=el('div'),i=el('input');i.value=o[k]||'';i.placeholder='images/example.png';
  const prev=el('img',{class:'imgprev'});const show=()=>{prev.style.display=i.value?'block':'none';prev.src=i.value};
  i.oninput=()=>{o[k]=i.value;show()};show();
  const f=el('input',{type:'file',accept:'image/*'});
  f.onchange=async()=>{const file=f.files[0];if(!file)return;
    if(file.size>2*1024*1024){status('圖片請小於 2MB','err');return}
    try{const path='images/'+Date.now()+'-'+file.name.replace(/[^\w.\-]/g,'_');
      const b64=await new Promise(r=>{const fr=new FileReader();fr.onload=()=>r(fr.result.split(',')[1]);fr.readAsDataURL(file)});
      status('上傳圖片中…');await ghPut(path,b64,'Add image '+path,true);
      i.value=path;o[k]=path;show();status('圖片已上傳','ok')}catch(e){status('圖片上傳失敗：'+e.message,'err')}};
  box.append(el('label',{},label),i,el('label',{},'或上傳圖片（需先連線 GitHub）'),f,prev);return box;
}
function build(o,f){
  const [k,type,label]=f;
  switch(type){
    case '文字':return text(o,k,label);
    case '雙語':return k===''?biSelf(o,label,false):bi(o,k,label,false);
    case '雙語區':return k===''?biSelf(o,label,true):bi(o,k,label,true);
    case '雙語清單':return bilist(o,k,label);
    case '選單':return select(o,k,label);
    case '圖片':return image(o,k,label);
  }
}

/* ---------- editor ---------- */
function renderEditor(){
  const root=$('editor');root.innerHTML='';
  SECTIONS.forEach(S=>{
    const panel=el('div',{class:'panel'});
    panel.append(el('div',{class:'sec-h'},el('h2',{},S.title)));
    if(S.single){S.fields.forEach(f=>panel.append(build(data[S.key],f)))}
    else{
      data[S.key]=data[S.key]||[];const list=el('div');
      const draw=()=>{list.innerHTML='';
        data[S.key].forEach((it,i)=>{
          const d=el('details');const sm=el('summary',{},S.label(it,i));d.append(sm);
          const body=el('div',{class:'body'});S.fields.forEach(f=>body.append(build(it,f)));
          const arr=data[S.key];
          const move=(dx)=>()=>{const j=i+dx;if(j<0||j>=arr.length)return;[arr[i],arr[j]]=[arr[j],arr[i]];draw()};
          body.append(el('div',{class:'actions'},el('button',{onclick:move(-1)},'↑ 上移'),el('button',{onclick:move(1)},'↓ 下移'),
            el('button',{class:'danger',onclick:()=>{if(confirm('刪除這筆？')){arr.splice(i,1);draw()}}},'刪除')));
          d.append(body);d.addEventListener('toggle',()=>{if(!d.open)sm.textContent=S.label(it,i)});list.append(d)});
        list.append(el('button',{onclick:()=>{data[S.key].push(S.tpl());draw();list.querySelectorAll('details')[data[S.key].length-1].open=true}},'＋ 新增'))};
      draw();panel.append(list);
    }
    root.append(panel);
  });
}

/* ---------- GitHub ---------- */
const cfg=()=>({o:$('gOwner').value.trim(),r:$('gRepo').value.trim(),b:$('gBranch').value.trim()||'main',t:$('gToken').value.trim()});
function saveCfg(){const c=cfg();localStorage.setItem('cvadmin',JSON.stringify({o:c.o,r:c.r,b:c.b,t:c.t}))}
(function(){try{const c=JSON.parse(localStorage.getItem('cvadmin')||'{}');$('gOwner').value=c.o||'';$('gRepo').value=c.r||'';$('gBranch').value=c.b||'main';$('gToken').value=c.t||''}catch{}})();
const b64enc=s=>btoa(unescape(encodeURIComponent(s)));
const b64dec=s=>decodeURIComponent(escape(atob(s.replace(/\n/g,''))));
async function gh(path,opt={}){
  const c=cfg();if(!c.o||!c.r||!c.t)throw new Error('請填寫 Owner / Repo / Token');
  const res=await fetch(`https://api.github.com/repos/${c.o}/${c.r}/contents/${path}`+(opt.method==='PUT'?'':`?ref=${c.b}`),
    {...opt,headers:{Authorization:'Bearer '+c.t,Accept:'application/vnd.github+json','Content-Type':'application/json'}});
  if(!res.ok){let m=res.status+'';try{m+=' '+(await res.json()).message}catch{}throw new Error(m)}
  return res.json();
}
async function ghPut(path,b64,message,isNew){
  const c=cfg();let body={message,content:b64,branch:c.b};
  if(!isNew&&sha)body.sha=sha;
  const r=await gh(path,{method:'PUT',body:JSON.stringify(body)});return r;
}
$('btnLoad').onclick=async()=>{
  try{saveCfg();status('載入中…');const r=await gh('data.json');sha=r.sha;data=JSON.parse(b64dec(r.content));renderEditor();status('已從 GitHub 載入','ok')}
  catch(e){status('載入失敗：'+e.message,'err')}};
$('btnLocal').onclick=async()=>{
  try{const r=await fetch('data.json?'+Date.now());data=await r.json();renderEditor();status('已載入本機 data.json（儲存前請先連線 GitHub 並載入以取得版本）','ok')}
  catch(e){status('載入失敗：'+e.message,'err')}};
$('btnSave').onclick=async()=>{
  if(!data)return status('尚未載入資料','err');
  try{saveCfg();status('儲存中…');
    if(!sha){try{const r=await gh('data.json');sha=r.sha}catch{}}
    const r=await ghPut('data.json',b64enc(JSON.stringify(data,null,2)+'\n'),'Update CV data via admin');
    sha=r.content.sha;status('已儲存！網站約 1 分鐘後更新','ok')}
  catch(e){status('儲存失敗：'+e.message,'err')}};
$('btnForget').onclick=()=>{$('gToken').value='';saveCfg();status('Token 已清除','ok')};
$('btnExport').onclick=()=>{if(!data)return;const a=el('a',{href:URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'})),download:'data.json'});a.click()};
$('btnImport').onclick=()=>$('fileImport').click();
$('fileImport').onchange=async e=>{try{data=JSON.parse(await e.target.files[0].text());renderEditor();status('已匯入','ok')}catch(err){status('JSON 格式錯誤','err')}};
window.addEventListener('beforeunload',e=>{});
</script>
</body>
</html>
